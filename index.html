            </div>
          </div>
        `;
        return;
      }

      updatePageMeta(work.title, work.summary || work.title);

      let pool = publishedWorks;
      if (work.series) {
        pool = publishedWorks.filter(w => w.series === work.series);
        pool.sort((a, b) => (a.orderInSeries || 0) - (b.orderInSeries || 0));
      } else {
        pool.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      const currentIndex = pool.findIndex(w => w.slug === work.slug);
      const prevWork = currentIndex > 0 ? pool[currentIndex - 1] : null;
      const nextWork = currentIndex < pool.length - 1 ? pool[currentIndex + 1] : null;

      const relatedWorks = (work.relatedSlugs || [])
        .map(rSlug => publishedWorks.find(w => w.slug === rSlug))
        .filter(Boolean);

      const catObj = CATEGORIES.find(c => c.key === work.type);
      const catLabel = catObj ? catObj.title : '单篇作品';

      container.innerHTML = `
        <div class="inner-page-wrap">
          <article class="reader-container">
            <nav class="reader-nav-bar" aria-label="阅读页面控制">
              <a href="#/archive/${work.type}" class="back-link">← 返回 ${catLabel} 目录</a>
              <div class="reader-controls">
                <button id="fontDecBtn" class="font-size-btn" title="减小字体">A-</button>
                <button id="fontIncBtn" class="font-size-btn" title="增大字体">A+</button>
              </div>
            </nav>

            <header class="reader-header">
              <div class="reader-meta-info">
                <span>${catLabel}</span>
                ${work.series ? `<span> · 《${work.series}》第 ${work.orderInSeries || 1} 卷</span>` : ''}
                <span> / ${work.date}</span>
              </div>
              <h1 class="reader-title">${work.title}</h1>
            </header>

            ${work.coverImage ? `
              <img class="reader-cover" id="readerCoverImg" src="${work.coverImage}" alt="${work.title} 主题插图">
            ` : ''}

            <div class="reader-body" id="readerBodyText"></div>

            <footer class="reader-context-footer">
              <nav class="series-pager" aria-label="作品切换导航">
                ${prevWork ? `
                  <a href="#/works/${prevWork.slug}" class="pager-slot prev">
                    <span class="pager-label">← 上一篇</span>
                    <span class="pager-title">${prevWork.title}</span>
                  </a>
                ` : `<div style="flex:1;"></div>`}
                ${nextWork ? `
                  <a href="#/works/${nextWork.slug}" class="pager-slot next">
                    <span class="pager-label">下一篇 →</span>
                    <span class="pager-title">${nextWork.title}</span>
                  </a>
                ` : `<div style="flex:1;"></div>`}
              </nav>

              <!-- 低调的写信给作者入口 -->
              <div class="letter-send-entry">
                <button class="letter-entry-btn open-letter-modal-btn" data-slug="${work.slug}" data-title="${work.title}">
                  𓅂 读罢有话想说？写信给作者
                </button>
              </div>

              ${relatedWorks.length > 0 ? `
                <div class="related-block">
                  <h3 class="related-heading">关联作品</h3>
                  <div class="related-tag-list">
                    ${relatedWorks.map(rw => `
                      <a href="#/works/${rw.slug}" class="related-chip">${rw.title}</a>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </footer>
          </article>
        </div>
      `;

      // 绑定阅读页写信按钮
      const sendLetterBtn = container.querySelector('.open-letter-modal-btn');
      if (sendLetterBtn) {
        sendLetterBtn.addEventListener('click', () => {
          openLetterModal(work.slug, work.title);
        });
      }

      const bodyEl = container.querySelector('#readerBodyText');
      renderSafeParagraphs(bodyEl, work.content);

      const coverImg = container.querySelector('#readerCoverImg');
      if (coverImg) {
        coverImg.onerror = () => coverImg.remove();
      }

      applyFontSize(bodyEl);
      container.querySelector('#fontIncBtn').onclick = () => {
        if (currentFontSizeLevel < 2) {
          currentFontSizeLevel++;
          applyFontSize(bodyEl);
        }
      };
      container.querySelector('#fontDecBtn').onclick = () => {
        if (currentFontSizeLevel > -1) {
          currentFontSizeLevel--;
          applyFontSize(bodyEl);
        }
      };

      // 实时监听正文滚动并更新进度条
      window.onscroll = () => {
        const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
        const progressEl = document.getElementById('read-progress');
        if (totalHeight > 0 && progressEl) {
          const pct = (window.scrollY / totalHeight) * 100;
          progressEl.style.width = `${Math.min(100, Math.max(0, pct))}%`;
        }
      };
    }

    function applyFontSize(el) {
      const sizes = ['1rem', '1.125rem', '1.25rem', '1.375rem'];
      el.style.fontSize = sizes[currentFontSizeLevel + 1];
    }

    /**
     * 4. 创作札记视图
     */
    function renderNotesView(container) {
      updatePageMeta('创作札记', '乌鸦与井的创作记录与反思');
      container.innerHTML = `
        <div class="inner-page-wrap">
          <div class="prose-content">
            <h1 class="archive-title" style="margin-bottom:24px;">创作札记</h1>
            <p class="archive-desc" style="margin-bottom:40px;">收录创作过程中的思考痕迹、版本变动备忘与未定稿的片段。</p>
            <div class="notes-timeline">
              ${AUTHOR_NOTES.map(note => `
                <article class="note-item">
                  <div class="note-date">${note.date}</div>
                  <h2 style="font-size:1.15rem; margin:0 0 10px 0; font-weight:500;">${note.title}</h2>
                  <p class="note-body">${note.body}</p>
                </article>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /**
     * 5. 关于视图
     */
    function renderAboutView(container) {
      updatePageMeta('关于', '关于乌鸦与井及其归档规则');
      container.innerHTML = `
        <div class="inner-page-wrap">
          <article class="prose-content">
            <h1 class="archive-title">关于乌鸦与井</h1>
            <p class="archive-desc" style="margin-bottom: 30px;">个人语料库与影像诗的数字存档空间。</p>

            <h2>站点定位</h2>
            <p>「乌鸦与井」是一个以文本检索为导向、以长久存续为目的的独立文学空间。这里没有推荐算法，没有互动评论区，亦无阅读流量统计。文字在写完后被放置于此，如同岩石自然沉淀于井底。</p>

            <h2>收录与组织</h2>
            <p>站点内容涵盖完整的小说系列、短篇虚构、场景随笔及工作札记。所有的文字均通过内建的词句索引与分类系统组织，读者可以通过检索意象或分类标签浏览特定的叙事序列。亦可前往<a href="#/notes" style="color:var(--color-accent); text-decoration:none;">「创作札记」</a>查看创作思考手记。</p>

            <h2>版权与引用</h2>
            <p>本站展示的所有小说正文、剧本片段、札记及原创主题影像，其著作权均归创作者所有。未经书面许可，请勿用于商业出版、大模型语料爬取或未经授权的二次改编。个人阅读分享请附带原始作品链接。</p>

            <!-- 关于页面底部的低调写信入口 -->
            <div class="letter-send-entry" style="margin-top:50px; text-align:left;">
              <p style="font-size:0.9rem; color:var(--color-text-muted); margin-bottom:12px;">
                如果你对作品有任何想法、回响或字句商榷，欢迎给作者寄一封信。信件为私人通信，不对外公开。
              </p>
              <button class="letter-entry-btn open-letter-modal-btn" data-slug="about-page" data-title="关于页面">
                𓅂 写信给作者
              </button>
            </div>
          </article>
        </div>
      `;

      const sendLetterBtn = container.querySelector('.open-letter-modal-btn');
      if (sendLetterBtn) {
        sendLetterBtn.addEventListener('click', () => {
          openLetterModal('about-page', '关于页面');
        });
      }
    }

    /**
     * 6. 作者私信管理视图 (#/admin/letters)
     */
    function renderAdminLettersView(container) {
      updatePageMeta('信件信箱', '乌鸦与井 — 私信管理');
      const savedSecret = sessionStorage.getItem('crow_well_admin_secret') || '';

      container.innerHTML = `
        <div class="inner-page-wrap admin-letters-wrap">
          <header class="archive-header">
            <h1 class="archive-title">信件信箱</h1>
            <p class="archive-desc">此处存放读者发来的私信。需要输入作者安全凭证以读取内容。</p>
          </header>

          <div id="adminAuthSection" class="admin-auth-box" style="${savedSecret ? 'display:none;' : 'display:block;'}">
            <div class="field-group">
              <label for="adminSecretInput">请输入管理安全密码 (ADMIN_SECRET)</label>
              <input type="password" id="adminSecretInput" class="field-input" placeholder="输入环境变量中配置的密钥...">
            </div>
            <button id="adminLoginBtn" class="btn-action-primary" style="margin-top:8px;">进入信箱</button>
            <div id="adminAuthError" style="font-size:0.8rem; color:var(--color-accent); margin-top:8px; display:none;"></div>
          </div>

          <div id="lettersListSection" style="${savedSecret ? 'display:block;' : 'display:none;'}">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
              <span id="lettersCountLabel" style="font-size:0.85rem; color:var(--color-text-muted);">正在同步信件...</span>
              <div>
                <button id="refreshLettersBtn" class="font-size-btn" style="margin-right:8px;">刷新</button>
                <button id="adminLogoutBtn" class="font-size-btn">锁定退出</button>
              </div>
            </div>
            <div id="lettersContainer"></div>
          </div>
        </div>
      `;

      const authSection = container.querySelector('#adminAuthSection');
      const listSection = container.querySelector('#lettersListSection');
      const secretInput = container.querySelector('#adminSecretInput');
      const loginBtn = container.querySelector('#adminLoginBtn');
      const authError = container.querySelector('#adminAuthError');
      const refreshBtn = container.querySelector('#refreshLettersBtn');
      const logoutBtn = container.querySelector('#adminLogoutBtn');

      function doFetchLetters(secret) {
        const countLabel = container.querySelector('#lettersCountLabel');
        const listDiv = container.querySelector('#lettersContainer');
        countLabel.textContent = '正在读取信件...';

        fetch('/api/letters', {
          headers: { 'Authorization': `Bearer ${secret}` }
        })
        .then(async res => {
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.message || '获取信件失败');
          }
          return data;
        })
        .then(data => {
          sessionStorage.setItem('crow_well_admin_secret', secret);
          authSection.style.display = 'none';
          listSection.style.display = 'block';
          renderLetters(data.letters || []);
        })
        .catch(err => {
          authSection.style.display = 'block';
          listSection.style.display = 'none';
          authError.style.display = 'block';
          authError.textContent = err.message;
        });
      }

      function renderLetters(letters) {
        const countLabel = container.querySelector('#lettersCountLabel');
        const listDiv = container.querySelector('#lettersContainer');
        countLabel.textContent = `共收到 ${letters.length} 封信件`;

        if (letters.length === 0) {
          listDiv.innerHTML = '<div class="empty-tip">信箱空空如也，暂未收到信件。</div>';
          return;
        }

        listDiv.innerHTML = '';
        letters.forEach(letItem => {
          const card = document.createElement('article');
          card.className = `letter-card-item ${letItem.is_read ? '' : 'unread'}`;

          const dateStr = new Date(letItem.created_at).toLocaleString('zh-CN', {
            year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
          });

          const senderName = letItem.sender_name || '一位未留名的读者';
          const emailDisplay = letItem.sender_email ? ` &lt;${escapeHTML(letItem.sender_email)}&gt;` : '';
          const sourceWork = letItem.work_slug ? ` · 来源: ${escapeHTML(letItem.work_slug)}` : '';

          card.innerHTML = `
            <div class="letter-card-meta">
              <div>
                <span class="letter-sender-info">${escapeHTML(senderName)}</span>
                <span>${emailDisplay}</span>
                <span>${sourceWork}</span>
              </div>
              <div>${dateStr}</div>
            </div>
            <div class="letter-card-body"></div>
            <div class="letter-actions-row">
              <button class="letter-small-btn toggle-read-btn">${letItem.is_read ? '标为未读' : '标为已读'}</button>
              <button class="letter-small-btn delete-letter-btn" style="color:var(--color-accent);">删除信件</button>
            </div>
          `;

          // 安全写入正文避免 XSS
          card.querySelector('.letter-card-body').textContent = letItem.content;

          // 绑定已读切换
          card.querySelector('.toggle-read-btn').addEventListener('click', () => {
            const secret = sessionStorage.getItem('crow_well_admin_secret');
            fetch('/api/letters', {
              method: 'PUT',
              headers: {
                'Authorization': `Bearer ${secret}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ id: letItem.id, is_read: !letItem.is_read })
            }).then(() => doFetchLetters(secret));
          });

          // 绑定删除
          card.querySelector('.delete-letter-btn').addEventListener('click', () => {
            const secret = sessionStorage.getItem('crow_well_admin_secret');
            fetch('/api/letters', {
              method: 'DELETE',
              headers: {
                'Authorization': `Bearer ${secret}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ id: letItem.id })
            }).then(() => doFetchLetters(secret));
          });

          listDiv.appendChild(card);
        });
      }

      loginBtn.addEventListener('click', () => {
        const sec = secretInput.value.trim();
        if (!sec) {
          authError.style.display = 'block';
          authError.textContent = '请输入密钥';
          return;
        }
        doFetchLetters(sec);
      });

      refreshBtn.addEventListener('click', () => {
        const sec = sessionStorage.getItem('crow_well_admin_secret');
        if (sec) doFetchLetters(sec);
      });

      logoutBtn.addEventListener('click', () => {
        sessionStorage.removeItem('crow_well_admin_secret');
        authSection.style.display = 'block';
        listSection.style.display = 'none';
        secretInput.value = '';
      });

      if (savedSecret) {
        doFetchLetters(savedSecret);
      }
    }

    function escapeHTML(str) {
      return (str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    /* ==========================================================================
       五、写信弹窗与提交交互
       ========================================================================== */
    const letterModal = document.getElementById('letterModal');
    let currentLetterWorkSlug = '';

    function openLetterModal(slug = '', title = '') {
      currentLetterWorkSlug = slug;
      const contextEl = document.getElementById('letterWorkContext');
      if (title && slug !== 'about-page') {
        contextEl.textContent = `关于《${title}》，若有所思或有所感触，可在此给作者写信。`;
      } else {
        contextEl.textContent = '有些字句落在纸面上，可能会在某颗心里荡起回声。若有所想，可在此留下。';
      }

      document.getElementById('letterContent').value = '';
      document.getElementById('letterCharCounter').textContent = '0 / 4000';
      const statusEl = document.getElementById('letterStatusBar');
      statusEl.className = 'letter-status-bar';
      statusEl.style.display = 'none';

      letterModal.classList.add('open');
      letterModal.setAttribute('aria-hidden', 'false');
    }

    function closeLetterModal() {
      letterModal.classList.remove('open');
      letterModal.setAttribute('aria-hidden', 'true');
    }

    document.getElementById('closeLetterModalBtn').addEventListener('click', closeLetterModal);
    document.getElementById('cancelLetterBtn').addEventListener('click', closeLetterModal);

    document.getElementById('letterContent').addEventListener('input', (e) => {
      const len = e.target.value.length;
      document.getElementById('letterCharCounter').textContent = `${len} / 4000`;
    });

    document.getElementById('submitLetterBtn').addEventListener('click', async () => {
      const content = document.getElementById('letterContent').value.trim();
      const senderName = document.getElementById('letterSenderName').value.trim();
      const senderEmail = document.getElementById('letterSenderEmail').value.trim();
      const hpCheck = document.getElementById('letterHpCheck').value.trim();
      const statusEl = document.getElementById('letterStatusBar');
      const submitBtn = document.getElementById('submitLetterBtn');

      if (!content) {
        statusEl.className = 'letter-status-bar error';
        statusEl.textContent = '请先写下想说的话再寄出。';
        return;
      }

      if (senderEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(senderEmail)) {
        statusEl.className = 'letter-status-bar error';
        statusEl.textContent = '请填写有效的邮箱地址，或留空直接发送。';
        return;
      }

      // 进入等待状态
      submitBtn.disabled = true;
      submitBtn.textContent = '寄出中...';
      statusEl.className = 'letter-status-bar';
      statusEl.style.display = 'none';

      try {
        const response = await fetch('/api/letters', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sender_name: senderName,
            sender_email: senderEmail,
            content: content,
            work_slug: currentLetterWorkSlug,
            hp_check: hpCheck
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          statusEl.className = 'letter-status-bar success';
          statusEl.textContent = result.message || '信件已成功送出。谢谢你的文字。';
          document.getElementById('letterContent').value = '';
          setTimeout(() => {
            closeLetterModal();
            submitBtn.disabled = false;
            submitBtn.textContent = '寄出信件 𓅂';
          }, 1800);
        } else {
          statusEl.className = 'letter-status-bar error';
          statusEl.textContent = result.message || '寄送失败，请稍后重试。';
          submitBtn.disabled = false;
          submitBtn.textContent = '寄出信件 𓅂';
        }
      } catch (err) {
        statusEl.className = 'letter-status-bar error';
        statusEl.textContent = '网络通信异常或后端服务未就绪，未能寄出。';
        submitBtn.disabled = false;
        submitBtn.textContent = '寄出信件 𓅂';
      }
    });

    /* ==========================================================================
       六、作品录入维护助手与初始化启动
       ========================================================================== */
    const helperModal = document.getElementById('helperModal');
    const openHelperBtn = document.getElementById('openHelperBtn');
    const closeHelperBtn = document.getElementById('closeHelperBtn');
    const generateCodeBtn = document.getElementById('generateCodeBtn');
    const outputArea = document.getElementById('outputCodeArea');
    const copyStatus = document.getElementById('copyStatusText');

    if (openHelperBtn) {
      openHelperBtn.addEventListener('click', () => {
        helperModal.classList.add('open');
        helperModal.setAttribute('aria-hidden', 'false');
      });
    }

    if (closeHelperBtn) {
      closeHelperBtn.addEventListener('click', () => {
        helperModal.classList.remove('open');
        helperModal.setAttribute('aria-hidden', 'true');
      });
    }

    if (generateCodeBtn) {
      generateCodeBtn.addEventListener('click', () => {
        const title = document.getElementById('helperTitle').value.trim() || '未命名作品';
        const slug = document.getElementById('helperSlug').value.trim() || 'untitled-' + Date.now();
        const type = document.getElementById('helperType').value;
        const series = document.getElementById('helperSeries').value.trim() || null;
        const orderVal = parseInt(document.getElementById('helperOrder').value.trim(), 10);
        const orderInSeries = isNaN(orderVal) ? null : orderVal;
        const date = document.getElementById('helperDate').value.trim() || new Date().toISOString().split('T')[0];
        const cover = document.getElementById('helperCover').value.trim();
        const tagsInput = document.getElementById('helperTags').value.trim();
        const tags = tagsInput ? tagsInput.split(/[,，、]/).map(t => t.trim()).filter(Boolean) : [];
        const summary = document.getElementById('helperSummary').value.trim();
        const content = document.getElementById('helperContent').value.trim();

        const workObj = {
          id: Date.now(),
          slug,
          title,
          type,
          series,
          orderInSeries,
          date,
          summary,
          coverImage: cover,
          tags,
          relatedSlugs: [],
          status: 'published',
          content
        };

        const jsonCode = JSON.stringify(workObj, null, 2);
        outputArea.style.display = 'block';
        outputArea.textContent = `// 将以下对象追加至 data.js 或 index.html 的 WORKS 数组中：\n${jsonCode},`;

        navigator.clipboard.writeText(jsonCode + ',').then(() => {
          copyStatus.textContent = '✓ 代码已复制到剪贴板';
          setTimeout(() => { copyStatus.textContent = ''; }, 3000);
        }).catch(() => {
          copyStatus.textContent = '生成完毕，请手动复制下方代码';
        });
      });
    }

    // 全局内部链接代理拦截：确保在沙箱预览和不同宿主环境下，点击跳转均能即时执行
    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link && link.getAttribute('href') && link.getAttribute('href').startsWith('#')) {
        const href = link.getAttribute('href');
        // 外部或非内部路由跳过
        if (href.startsWith('#/')) {
          e.preventDefault();
          if (window.location.hash !== href) {
            window.location.hash = href;
          }
          navigate();
        }
      }
    });

    // 路由监听与初始加载
    window.addEventListener('hashchange', navigate);
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      navigate();
      syncWorksFromBackend(); // 异步同步 D1 中智能体维护的文章
    });

    // 立即执行一次导航渲染
    initTheme();
    navigate();
  </script>
</body>
</html>
