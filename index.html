<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乌鸦与井 — 个人语料库与影像诗</title>
  <meta name="description" content="乌鸦与井：个人文学作品档案馆，以搜索、阅读和探索为核心的数字语料空间。">
  <style>
    /* ==========================================================================
       设计系统：极简、编辑式文学搜索引擎风格
       ========================================================================== */
    :root {
      --font-serif: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", "STSong", "STZhongsong", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      /* 极简轻盈白底、淡墨微风色系 */
      --color-bg: #fcfbf9;
      --color-surface: #ffffff;
      --color-card-bg: #f7f6f2;
      --color-text-main: #242220;
      --color-text-muted: #78746d;
      --color-text-subtle: #aaa59d;
      --color-accent: #b84c3b;        /* 沉着克制的陶土朱砂红 */
      --color-accent-soft: rgba(184, 76, 59, 0.08);
      --color-border: #eae6df;
      --color-border-subtle: #f2efe9;
      --shadow-clean: 0 4px 20px rgba(0, 0, 0, 0.03);

      --max-w-content: 680px;
      --max-w-wide: 960px;
      --transition: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.dark-mode {
      --color-bg: #151413;
      --color-surface: #1c1b1a;
      --color-card-bg: #22211f;
      --color-text-main: #e8e4dc;
      --color-text-muted: #959086;
      --color-text-subtle: #68645c;
      --color-accent: #cf5f4f;
      --color-accent-soft: rgba(207, 95, 79, 0.12);
      --color-border: #282623;
      --color-border-subtle: #1f1e1c;
      --shadow-clean: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-bg);
      color: var(--color-text-main);
      font-family: var(--font-sans);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      transition: background-color var(--transition), color var(--transition);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部滚动进度指示条 */
    .read-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background-color: var(--color-accent);
      z-index: 999;
      transition: width 0.1s linear;
    }

    /* 顶栏导航：仅保留必要导航项 */
    .global-header {
      padding: 22px 36px;
      position: relative;
      z-index: 20;
    }

    .nav-inner {
      max-width: var(--max-w-wide);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--color-text-main);
    }

    .brand-symbol {
      font-size: 1.25rem;
      color: var(--color-accent);
      line-height: 1;
    }

    .brand-name {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 2.5px;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-item {
      color: var(--color-text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      letter-spacing: 1.5px;
      transition: color var(--transition);
    }

    .nav-item:hover, .nav-item.active {
      color: var(--color-accent);
    }

    .theme-toggle-btn {
      background: none;
      border: 1px solid var(--color-border);
      color: var(--color-text-muted);
      padding: 3px 10px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      transition: all var(--transition);
    }

    .theme-toggle-btn:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    /* 主内容布局容器 */
    .main-container {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================================================
       极简搜索引擎首页：大量留白 + 每日插画融合背景 + 底部每日精选
       ========================================================================== */
    .home-editorial-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 8vh 24px 40px 24px;
      min-height: calc(100vh - 160px);
      overflow: hidden;
    }

    /* 每日插画作为沉浸式背景层，带呼吸感半透明遮罩与微噪柔光 */
    .home-bg-artwork-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-size: cover;
      background-position: center;
      filter: saturate(0.85);
      opacity: 0.16;
      transition: opacity 0.8s ease;
      z-index: 1;
      pointer-events: none;
    }

    body.dark-mode .home-bg-artwork-layer {
      opacity: 0.12;
      filter: saturate(0.7) brightness(0.7);
    }

    .home-bg-link-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      cursor: pointer;
    }

    /* 首页居中搜索主体 */
    .home-center-stage {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 580px;
      margin: auto 0;
      text-align: center;
      pointer-events: auto;
    }

    .home-stage-header {
      margin-bottom: 34px;
    }

    .home-main-title {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: 5px;
      margin: 0 0 10px 0;
      color: var(--color-text-main);
      line-height: 1.2;
    }

    .home-sub-slogan {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      color: var(--color-text-muted);
      letter-spacing: 2.5px;
      margin: 0;
      font-weight: 300;
    }

    /* 极简搜索引擎搜索框 */
    .editorial-search-capsule {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 32px;
      padding: 10px 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .editorial-search-capsule:focus-within {
      border-color: var(--color-accent);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
    }

    .editorial-search-input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: var(--font-serif);
      font-size: 1.05rem;
      color: var(--color-text-main);
      outline: none;
      padding: 4px 6px;
    }

    .editorial-search-input::placeholder {
      color: var(--color-text-subtle);
      font-family: var(--font-serif);
      font-size: 0.92rem;
      letter-spacing: 1px;
    }

    .search-clear-btn {
      background: none;
      border: none;
      color: var(--color-text-subtle);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px 8px;
      display: none;
      line-height: 1;
    }

    .search-clear-btn:hover {
      color: var(--color-accent);
    }

    /* 搜索结果在首页原地优雅展开 */
    .home-search-results-panel {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 620px;
      margin: 24px auto 0 auto;
      text-align: left;
    }

    /* 首页底部每日精选条 */
    .home-bottom-feature {
      position: relative;
      z-index: 10;
      margin-top: auto;
      padding-top: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.86rem;
      color: var(--color-text-muted);
      font-family: var(--font-serif);
      letter-spacing: 1px;
      pointer-events: auto;
    }

    .feature-tag-lead {
      color: var(--color-text-subtle);
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .feature-work-link {
      color: var(--color-text-main);
      text-decoration: none;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 2px;
      transition: all var(--transition);
      cursor: pointer;
    }

    .feature-work-link:hover {
      color: var(--color-accent);
      border-color: var(--color-accent);
    }

    /* ==========================================================================
       通用内页容器与排版（目录页、阅读页、关于页）
       ========================================================================== */
    .inner-page-wrap {
      max-width: var(--max-w-wide);
      margin: 0 auto;
      padding: 24px 24px 80px 24px;
      width: 100%;
    }

    /* 目录页分类导航 */
    .archive-category-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 36px;
    }

    .archive-cat-btn {
      text-decoration: none;
      font-family: var(--font-serif);
      font-size: 0.88rem;
      color: var(--color-text-muted);
      padding: 5px 14px;
      background: var(--color-card-bg);
      border: 1px solid var(--color-border-subtle);
      border-radius: 20px;
      transition: all var(--transition);
      letter-spacing: 1px;
    }

    .archive-cat-btn:hover, .archive-cat-btn.active {
      background: var(--color-surface);
      color: var(--color-accent);
      border-color: var(--color-accent);
    }

    .archive-header {
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .archive-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 500;
      margin: 0 0 6px 0;
      color: var(--color-text-main);
      letter-spacing: 1px;
    }

    .archive-desc {
      color: var(--color-text-muted);
      font-size: 0.88rem;
      margin: 0;
    }

    .works-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .work-row-item {
      border-bottom: 1px solid var(--color-border-subtle);
      padding-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 24px;
      text-decoration: none;
      color: inherit;
      transition: transform var(--transition), opacity var(--transition);
      align-items: center;
    }

    .work-row-item.no-thumb {
      grid-template-columns: 1fr;
    }

    .work-row-item:hover {
      transform: translateX(4px);
      opacity: 0.85;
    }

    .work-meta {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--color-text-subtle);
      margin-bottom: 4px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .work-title {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 500;
      margin: 0 0 6px 0;
      line-height: 1.35;
      color: var(--color-text-main);
    }

    .work-summary {
      font-size: 0.86rem;
      color: var(--color-text-muted);
      margin: 0;
      line-height: 1.6;
    }

    .work-thumb {
      width: 90px;
      height: 72px;
      object-fit: cover;
      background-color: var(--color-card-bg);
      border-radius: 4px;
    }

    /* ==========================================================================
       独立阅读器页面 (Reader View)
       ========================================================================== */
    .reader-container {
      max-width: var(--max-w-content);
      margin: 0 auto;
      padding: 10px 0 60px 0;
    }

    .reader-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--color-text-subtle);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 1px;
      transition: color var(--transition);
    }

    .back-link:hover {
      color: var(--color-accent);
    }

    .reader-controls {
      display: flex;
      gap: 8px;
    }

    .font-size-btn {
      background: none;
      border: 1px solid var(--color-border);
      padding: 3px 8px;
      cursor: pointer;
      color: var(--color-text-muted);
      border-radius: 2px;
      font-size: 0.78rem;
      transition: all var(--transition);
    }

    .font-size-btn:hover {
      color: var(--color-text-main);
      border-color: var(--color-text-main);
    }

    .reader-header {
      margin-bottom: 36px;
    }

    .reader-meta-info {
      font-size: 0.78rem;
      color: var(--color-accent);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      font-family: var(--font-serif);
    }

    .reader-title {
      font-family: var(--font-serif);
      font-size: 2.1rem;
      font-weight: 500;
      line-height: 1.35;
      margin: 0 0 16px 0;
      color: var(--color-text-main);
    }

    .reader-cover {
      width: 100%;
      max-height: 440px;
      object-fit: cover;
      border-radius: 3px;
      margin-bottom: 40px;
      box-shadow: var(--shadow-clean);
    }

    .reader-body {
      font-family: var(--font-serif);
      font-size: 1.125rem;
      line-height: 2.25;
      color: var(--color-text-main);
      letter-spacing: 0.25px;
    }

    .reader-body p {
      margin: 0 0 1.6em 0;
      text-indent: 2em;
      white-space: pre-wrap; /* 忠实保留对话破折号、空格与特殊缩进 */
    }

    /* 正文随文插图与图注样式 */
    .reader-inline-figure {
      margin: 2.4em auto;
      text-align: center;
      max-width: 100%;
    }

    .reader-inline-img {
      display: block;
      max-width: 100%;
      height: auto;
      max-height: 520px;
      margin: 0 auto;
      border-radius: 3px;
      box-shadow: var(--shadow-clean);
      border: 1px solid var(--color-border-subtle);
      object-fit: cover;
    }

    .reader-inline-caption {
      display: block;
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--color-text-subtle);
      font-family: var(--font-serif);
      letter-spacing: 1px;
      text-align: center;
    }

    .reader-context-footer {
      margin-top: 70px;
      padding-top: 32px;
      border-top: 1px solid var(--color-border-subtle);
    }

    .series-pager {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .pager-slot {
      flex: 1;
      text-decoration: none;
      color: inherit;
      padding: 14px 16px;
      background: var(--color-card-bg);
      border-radius: 4px;
      transition: all var(--transition);
    }

    .pager-slot:hover {
      background: var(--color-surface);
      box-shadow: var(--shadow-clean);
      transform: translateY(-2px);
    }

    .pager-slot.next {
      text-align: right;
    }

    .pager-label {
      font-size: 0.72rem;
      color: var(--color-text-subtle);
      display: block;
      margin-bottom: 4px;
    }

    .pager-title {
      font-family: var(--font-serif);
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--color-text-main);
    }

    .related-block {
      margin-top: 24px;
    }

    .related-heading {
      font-family: var(--font-serif);
      font-size: 0.88rem;
      color: var(--color-text-subtle);
      margin-bottom: 12px;
    }

    .related-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .related-chip {
      text-decoration: none;
      font-family: var(--font-serif);
      font-size: 0.84rem;
      color: var(--color-text-muted);
      padding: 4px 12px;
      background: var(--color-card-bg);
      border-radius: 14px;
      transition: all var(--transition);
    }

    .related-chip:hover {
      color: var(--color-accent);
      background: var(--color-accent-soft);
    }

    /* ==========================================================================
       写信与作者私信入口样式（保持克制、文学气质，杜绝浮夸）
       ========================================================================== */
    .letter-send-entry {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px dashed var(--color-border);
      text-align: center;
    }

    .letter-entry-btn {
      background: none;
      border: 1px solid var(--color-border);
      color: var(--color-text-muted);
      font-family: var(--font-serif);
      font-size: 0.85rem;
      padding: 6px 18px;
      border-radius: 20px;
      cursor: pointer;
      letter-spacing: 1.5px;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .letter-entry-btn:hover {
      color: var(--color-accent);
      border-color: var(--color-accent);
      background: var(--color-surface);
      transform: translateY(-1px);
    }

    /* 写信表单弹窗优化 */
    .letter-form-card {
      max-width: 520px;
      background: var(--color-surface);
    }

    .letter-form-header {
      margin-bottom: 20px;
    }

    .letter-form-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 500;
      margin: 0 0 6px 0;
      color: var(--color-text-main);
    }

    .letter-form-sub {
      font-size: 0.82rem;
      color: var(--color-text-muted);
      margin: 0;
      line-height: 1.6;
    }

    .letter-field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    @media (max-width: 540px) {
      .letter-field-row {
        grid-template-columns: 1fr;
      }
    }

    .letter-textarea {
      min-height: 140px;
      line-height: 1.8;
    }

    .letter-status-bar {
      margin-top: 12px;
      font-size: 0.82rem;
      line-height: 1.5;
      display: none;
      padding: 8px 12px;
      border-radius: 4px;
    }

    .letter-status-bar.error {
      display: block;
      background: rgba(184, 76, 59, 0.08);
      color: var(--color-accent);
      border: 1px solid var(--color-accent);
    }

    .letter-status-bar.success {
      display: block;
      background: rgba(60, 140, 90, 0.08);
      color: #2b7a4b;
      border: 1px solid #3c8c5a;
    }

    /* 作者管理端私信列表样式 */
    .admin-letters-wrap {
      max-width: var(--max-w-content);
      margin: 0 auto;
    }

    .admin-auth-box {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 24px;
      border-radius: 4px;
      margin: 20px 0;
    }

    .letter-card-item {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 16px;
      transition: all var(--transition);
      position: relative;
    }

    .letter-card-item.unread {
      border-left: 3px solid var(--color-accent);
    }

    .letter-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--color-text-subtle);
      margin-bottom: 12px;
    }

    .letter-sender-info {
      font-weight: 500;
      color: var(--color-text-main);
    }

    .letter-card-body {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      line-height: 1.9;
      color: var(--color-text-main);
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0 0 16px 0;
    }

    .letter-actions-row {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      border-top: 1px solid var(--color-border-subtle);
      padding-top: 10px;
    }

    .letter-small-btn {
      background: none;
      border: 1px solid var(--color-border);
      font-size: 0.75rem;
      padding: 2px 8px;
      color: var(--color-text-muted);
      border-radius: 2px;
      cursor: pointer;
    }

    .letter-small-btn:hover {
      color: var(--color-accent);
      border-color: var(--color-accent);
    }

    /* 隐藏的蜜罐输入框 */
    .hp-field {
      position: absolute;
      left: -9999px;
      opacity: 0;
      height: 0;
      width: 0;
      pointer-events: none;
    }

    /* ==========================================================================
       札记与关于页面
       ========================================================================== */
    .prose-content {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      line-height: 2.15;
      max-width: var(--max-w-content);
      margin: 0 auto;
    }

    .prose-content h2 {
      font-size: 1.3rem;
      margin: 36px 0 14px 0;
      border-left: 2px solid var(--color-accent);
      padding-left: 12px;
      font-weight: 500;
      color: var(--color-text-main);
    }

    .note-item {
      border-left: 1px solid var(--color-border);
      padding-left: 20px;
      margin-bottom: 36px;
    }

    .note-date {
      font-size: 0.78rem;
      color: var(--color-text-muted);
      margin-bottom: 4px;
      font-family: var(--font-sans);
    }

    .note-body {
      font-size: 0.98rem;
      line-height: 2.0;
      margin: 0;
      color: var(--color-text-main);
    }

    /* 极简页脚 */
    .global-footer {
      padding: 24px 36px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--color-text-subtle);
      font-family: var(--font-serif);
      letter-spacing: 1px;
    }

    .footer-inner {
      max-width: var(--max-w-wide);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media (max-width: 640px) {
      .footer-inner {
        flex-direction: column;
        gap: 8px;
      }
    }

    .admin-helper-trigger {
      background: none;
      border: none;
      color: var(--color-text-subtle);
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
      opacity: 0.7;
      transition: color var(--transition);
    }

    .admin-helper-trigger:hover {
      color: var(--color-accent);
    }

    /* 模态弹窗 */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.15rem;
    }

    .close-modal-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--color-text-muted);
      cursor: pointer;
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--color-text-muted);
      margin-bottom: 4px;
    }

    .field-input, .field-textarea, .field-select {
      width: 100%;
      padding: 8px 10px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      color: var(--color-text-main);
      font-size: 0.88rem;
      outline: none;
    }

    .field-input:focus, .field-textarea:focus, .field-select:focus {
      border-color: var(--color-accent);
    }

    .field-textarea {
      resize: vertical;
      min-height: 70px;
      font-family: var(--font-serif);
    }

    .copy-code-area {
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
      margin-top: 12px;
      border-radius: 4px;
    }

    .btn-action-primary {
      background: var(--color-accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: opacity var(--transition);
    }

    .btn-action-primary:hover {
      opacity: 0.9;
    }

    .empty-tip {
      padding: 40px 0;
      text-align: center;
      color: var(--color-text-subtle);
      font-family: var(--font-serif);
      font-size: 0.95rem;
    }/* ==========================================================================
       移动端与平板自适应增强（追加层，不修改任何桌面端原样式）
       ========================================================================== */

    /* 1. 全局触控与滚动防溢出兜底 */
    html, body {
      overflow-x: hidden;
      min-height: 100dvh;
    }

    /* 2. 平板端优化 (768px - 1023px) */
    @media (max-width: 1023px) {
      .home-viewport {
        padding: 36px 20px 28px;
        min-height: calc(100dvh - var(--nav-height, 58px));
      }
      .home-main-title {
        font-size: 2.25rem;
      }
      .inner-page-wrap {
        padding: 24px 20px 70px 20px;
      }
    }

    /* 3. 手机端优化 (<= 767px) */
    @media (max-width: 767px) {
      .nav-inner {
        padding: 0 16px;
      }
      .nav-brand {
        font-size: 1.08rem;
        letter-spacing: 1.5px;
      }
      .nav-links {
        gap: 12px;
        font-size: 0.88rem;
      }

      /* 首页竖屏背景与构图收拢 */
      .home-viewport {
        padding: 24px 16px 24px;
        justify-content: space-around;
        min-height: calc(100dvh - var(--nav-height, 54px));
      }
      .home-bg-artwork-layer {
        background-position: center 30%;
        opacity: 0.2;
      }
      body.dark-mode .home-bg-artwork-layer {
        opacity: 0.16;
      }
      .home-stage-header {
        margin-bottom: 24px;
      }
      .home-main-title {
        font-size: 1.95rem;
        letter-spacing: 3.5px;
        margin-bottom: 8px;
      }
      .home-sub-slogan {
        font-size: 0.86rem;
        letter-spacing: 1.8px;
      }
      .editorial-search-capsule {
        padding: 8px 16px;
        border-radius: 26px;
      }
      .editorial-search-input {
        font-size: 0.96rem;
      }
      .home-bottom-feature {
        padding-top: 16px;
        font-size: 0.82rem;
        line-height: 1.4;
      }
      .feature-work-link {
        word-break: break-all;
      }

      /* 目录页长标题与日期防挤压折行 */
      .catalog-title {
        font-size: 1.5rem;
      }
      .work-item-row {
        flex-direction: column;
        align-items: flex-start;
        padding: 14px 0;
        gap: 6px;
      }
      .work-title-link {
        font-size: 1.05rem;
        line-height: 1.5;
      }
      .work-meta-right {
        font-size: 0.78rem;
      }

      /* 阅读页移动端边距与排版 */
      .reading-article {
        margin-top: 16px;
      }
      .article-header {
        margin-bottom: 24px;
        padding-bottom: 20px;
      }
      .article-main-title {
        font-size: 1.55rem;
        letter-spacing: 0.5px;
        line-height: 1.35;
      }
      .article-body {
        font-size: 1.05rem;
        line-height: 1.95;
        letter-spacing: 0.3px;
      }
      .article-body p {
        margin: 1.4em 0;
      }
      .article-end-actions {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
        gap: 12px;
      }
      .article-end-actions a {
        justify-content: center;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 4px;
        padding: 8px 12px;
      }

      /* 浮动写信胶囊触控与弹窗高度防遮挡 */
      .floating-write-btn {
        bottom: 16px;
        right: 16px;
        padding: 6px 14px;
        font-size: 0.82rem;
      }
      .modal-card {
        max-height: 90dvh;
        overflow-y: auto;
      }
    }

    /* 4. 超小屏 (<= 360px) 微调 */
    @media (max-width: 360px) {
      .home-main-title {
        font-size: 1.7rem;
        letter-spacing: 2px;
      }
      .home-sub-slogan {
        font-size: 0.8rem;
        letter-spacing: 1.2px;
      }
      .nav-links {
        gap: 8px;
      }
      .article-main-title {
        font-size: 1.4rem;
      }
      .article-body {
        font-size: 0.98rem;
        line-height: 1.9;
      }
    }
    /* ==========================================================================
       首页画报化改造（增量追加层）
       作用范围：仅首页容器内的 .home-magazine-layout / .featured-magazine-tile
       等新增类，不改动阅读页、归档页、关于页、来信管理页与录入助手样式。
       ========================================================================== */

    /* 首页容器略收紧留白，为画报磁贴腾出呼吸空间 */
    .home-magazine-layout {
      padding-top: 4vh;
      padding-bottom: 30px;
    }

    /* 首页背景大图深度虚化：父容器 .home-editorial-wrapper 已 overflow:hidden，
       scale(1.08) 用于消除模糊造成的边缘露白，且不会产生横向滚动条 */
    .home-bg-artwork-layer.blurred {
      filter: blur(40px) saturate(1.1) brightness(0.45);
      transform: scale(1.08);
      transform-origin: center center;
      opacity: 0.35;
      transition: filter 0.8s ease, opacity 0.8s ease;
    }

    body.dark-mode .home-bg-artwork-layer.blurred {
      filter: blur(48px) saturate(0.9) brightness(0.25);
      opacity: 0.4;
    }

    /* 居中舞台放宽到画报尺寸（该类仅首页使用） */
    .home-center-stage.home-center-stage--magazine {
      max-width: 720px;
    }

    .home-center-stage--magazine .home-stage-header {
      margin-bottom: 26px;
    }

    /* 长方形图文画报磁贴 */
    .featured-magazine-tile {
      display: flex;
      width: 100%;
      max-width: 680px;
      margin: 0 auto 24px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
    }

    .featured-magazine-tile:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 56px rgba(0, 0, 0, 0.18);
      border-color: var(--color-text-subtle);
    }

    .featured-magazine-tile:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
      border-color: var(--color-accent);
    }

    /* 磁贴左侧封面（约 58%） */
    .tile-cover-wrapper {
      flex: 0 0 58%;
      position: relative;
      min-height: 280px;
      background-color: #1a1a1a;
      overflow: hidden;
    }

    .tile-cover-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transition: transform 0.6s ease;
    }

    .featured-magazine-tile:hover .tile-cover-img {
      transform: scale(1.04);
    }

    /* 磁贴右侧文句摘选（约 42%） */
    .tile-content-wrapper {
      flex: 0 0 42%;
      min-width: 0;
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      background: var(--color-surface);
      border-left: 1px solid var(--color-border-subtle);
    }

    .tile-text-block {
      min-width: 0;
    }

    .tile-badge {
      font-size: 0.76rem;
      letter-spacing: 1.5px;
      color: var(--color-accent);
      text-transform: uppercase;
      margin-bottom: 6px;
      font-family: var(--font-serif);
    }

    .tile-work-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 1px;
      margin: 0 0 12px 0;
      color: var(--color-text-main);
      line-height: 1.3;
    }

    .tile-work-quote {
      font-family: var(--font-serif);
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--color-text-muted);
      letter-spacing: 0.4px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      margin: 0 0 14px 0;
    }

    .tile-read-cue {
      font-size: 0.82rem;
      color: var(--color-text-subtle);
      letter-spacing: 1px;
      align-self: flex-start;
      transition: color var(--transition);
    }

    .featured-magazine-tile:hover .tile-read-cue {
      color: var(--color-accent);
    }

    /* 分类标签横条 */
    .home-categories-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin: 0 auto 28px;
      font-size: 0.92rem;
      letter-spacing: 1.5px;
      color: var(--color-text-muted);
      font-family: var(--font-serif);
    }

    .home-categories-bar a {
      transition: color var(--transition);
      padding: 4px;
      color: inherit;
      text-decoration: none;
    }

    .home-categories-bar a:hover,
    .home-categories-bar a:focus-visible {
      color: var(--color-accent);
    }

    .home-categories-bar a:focus-visible {
      outline: 1px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .home-categories-bar .divider {
      color: var(--color-border);
      user-select: none;
    }

    /* 底部轻量检索区 */
    .home-footer-search-wrap {
      width: 100%;
      max-width: 440px;
      margin: 0 auto 16px;
    }

    .home-footer-search-wrap .editorial-search-capsule {
      padding: 6px 14px;
      border-radius: 20px;
    }

    .home-footer-search-wrap .editorial-search-input {
      font-size: 0.94rem;
      min-width: 0;
    }

    .search-random-btn {
      background: none;
      border: none;
      color: var(--color-text-subtle);
      font-size: 0.82rem;
      cursor: pointer;
      padding: 4px 8px;
      font-family: inherit;
      white-space: nowrap;
      border-radius: 12px;
      transition: color var(--transition), background-color var(--transition);
    }

    .search-random-btn:hover,
    .search-random-btn:focus-visible {
      color: var(--color-accent);
    }

    .search-random-btn:focus-visible {
      outline: 1px solid var(--color-accent);
      outline-offset: 1px;
    }

    /* 指路标签 */
    .search-suggest-chips {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--color-text-subtle);
      font-family: var(--font-serif);
    }

    .chip-lead {
      letter-spacing: 1px;
    }

    .suggest-chip {
      background: none;
      border: 1px dashed var(--color-border);
      color: var(--color-text-muted);
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
    }

    .suggest-chip:hover,
    .suggest-chip:focus-visible {
      color: var(--color-accent);
      border-color: var(--color-accent);
    }

    .suggest-chip:focus-visible {
      outline: 1px solid var(--color-accent);
      outline-offset: 2px;
    }

    /* 检索结果面板：依旧处于正常文档流，不覆盖磁贴 / 分类栏 / 底部入口 */
    .home-center-stage--magazine .home-search-results-panel {
      max-width: 620px;
    }

    /* 深色模式下的磁贴阴影与封面底色 */
    body.dark-mode .featured-magazine-tile {
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }

    body.dark-mode .featured-magazine-tile:hover {
      box-shadow: 0 20px 56px rgba(0, 0, 0, 0.55);
    }

    /* 移动端断点适配 (<= 680px)：磁贴转为上图下文 */
    @media (max-width: 680px) {
      .home-magazine-layout {
        padding: 20px 16px 26px;
      }

      .home-bg-artwork-layer.blurred {
        filter: blur(30px) saturate(1.05) brightness(0.5);
        opacity: 0.3;
      }

      body.dark-mode .home-bg-artwork-layer.blurred {
        filter: blur(36px) saturate(0.9) brightness(0.28);
        opacity: 0.36;
      }

      .home-center-stage--magazine .home-stage-header {
        margin-bottom: 20px;
      }

      .featured-magazine-tile {
        flex-direction: column;
        max-width: 100%;
        margin-bottom: 20px;
      }

      .tile-cover-wrapper {
        min-height: 190px;
        flex: none;
        height: 190px;
      }

      .tile-content-wrapper {
        flex: none;
        padding: 18px 16px;
        border-left: none;
        border-top: 1px solid var(--color-border-subtle);
      }

      .tile-work-title {
        font-size: 1.12rem;
        margin-bottom: 10px;
      }

      .tile-work-quote {
        -webkit-line-clamp: 3;
        font-size: 0.86rem;
        line-height: 1.75;
        margin-bottom: 12px;
      }

      .home-categories-bar {
        gap: 12px;
        font-size: 0.85rem;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .home-categories-bar a {
        padding: 8px 4px;
      }

      .home-footer-search-wrap {
        max-width: 100%;
      }

      .home-footer-search-wrap .editorial-search-capsule {
        padding: 6px 12px;
      }

      .search-random-btn {
        padding: 8px 6px;
      }

      .suggest-chip {
        padding: 6px 12px;
        font-size: 0.78rem;
      }

      /* 首页在手机上同时承载标题、分类与检索，顶栏需避免逐字换行 */
      .global-header {
        padding: 16px;
      }

      .nav-inner {
        gap: 10px;
      }

      .brand-name {
        font-size: 1.02rem;
        letter-spacing: 1px;
        white-space: nowrap;
      }

      .site-nav {
        gap: 12px;
        flex-shrink: 0;
      }

      .nav-item {
        font-size: 0.82rem;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      .theme-toggle-btn {
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <!-- 阅读进度指示条 -->
  <div id="read-progress" class="read-progress" aria-hidden="true"></div>

  <!-- 顶部轻量导航：仅保留必要项（目录、关于、主题） -->
  <header class="global-header" role="banner">
    <div class="nav-inner">
      <a href="#/" class="brand-link" aria-label="返回乌鸦与井首页">
        <span class="brand-symbol">𓅂</span>
        <span class="brand-name">乌鸦与井</span>
      </a>
      <nav class="site-nav" role="navigation" aria-label="全局导航">
        <a href="#/archive/all" class="nav-item" id="nav-archive">目录</a>
        <a href="#/about" class="nav-item" id="nav-about">关于</a>
        <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="切换浅色与深色模式">
          <span id="themeToggleText">浅色</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- 动态视图挂载容器 -->
  <main id="main-content" class="main-container" role="main"></main>

  <!-- 全局精简页脚 -->
  <footer class="global-footer" role="contentinfo">
    <div class="footer-inner">
      <span>乌鸦与井 / 个人语料库与影像诗</span>
      <div style="display:flex; gap:16px; align-items:center;">
        <a href="#/admin/letters" style="color:var(--color-text-subtle); text-decoration:none; font-size:0.75rem;">信件信箱</a>
        <button id="openHelperBtn" class="admin-helper-trigger">🛠 录入助手</button>
      </div>
    </div>
  </footer>

  <!-- 写信给作者模态弹窗 -->
  <div id="letterModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card letter-form-card">
      <div class="modal-header">
        <h3 class="letter-form-title">寄一封信</h3>
        <button id="closeLetterModalBtn" class="close-modal-btn" aria-label="关闭写信窗口">✕</button>
      </div>
      <div class="letter-form-header">
        <p class="letter-form-sub" id="letterWorkContext">
          有些字句落在纸面上，可能会在某颗心里荡起回声。若有所想，可在此留下。
        </p>
      </div>

      <!-- 蜜罐防爬虫字段 -->
      <input type="text" id="letterHpCheck" class="hp-field" tabindex="-1" autocomplete="off">

      <div class="letter-field-row">
        <div class="field-group">
          <label for="letterSenderName">怎么称呼你（选填）</label>
          <input type="text" id="letterSenderName" class="field-input" maxlength="40" placeholder="例如：旅人、或留空">
        </div>
        <div class="field-group">
          <label for="letterSenderEmail">回信邮箱（选填）</label>
          <input type="email" id="letterSenderEmail" class="field-input" maxlength="80" placeholder="方便必要时作者回信">
        </div>
      </div>

      <div class="field-group">
        <label for="letterContent">信件正文（必填）</label>
        <textarea id="letterContent" class="field-textarea letter-textarea" maxlength="4000" placeholder="想对作者说的话……"></textarea>
        <div style="display:flex; justify-content:space-between; margin-top:4px;">
          <span style="font-size:0.72rem; color:var(--color-text-subtle);">信件仅作者可见，不会被公开展示</span>
          <span id="letterCharCounter" style="font-size:0.72rem; color:var(--color-text-subtle);">0 / 4000</span>
        </div>
      </div>

      <div id="letterStatusBar" class="letter-status-bar" role="alert"></div>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:16px;">

平时我对这里的客人漠不关心，但今天进来的一对陌生面孔——一个很有气质的女性带着一个小男孩——却引起了我的注意。不算高挑的身材，并不精致的面容，但浑身充满一种沉静而知性的气息。小男孩大概五岁左右，长长睫毛大眼睛，很安静。也是奇怪，往常没什么人的奶茶店今天却满了，目测只有我对面有空位。

"您孩子去上幼儿园了？"我突然想到。

毕业典礼后第七天。饭点到了，我下楼盛饭，端回房间。父亲在客厅没动，隔着一道墙我听见他清了清嗓子，说邻居又问起我，问我到底考不考公。

我说不考。

他说这年头做生意的十个有九个赔本，说他这辈子图什么，不就图我安稳。他还在说，我已经站起来，把门带上，力气用大了，"哐"一声。

隔着门，我听见他叹了一口气。很轻，但那道门好像没能真的把它挡住。

那之后我很少出门。手机开着，但没人打给我，我也没打给谁。饭照吃，只是味同嚼蜡。晚上睡不着，白天又睡不醒，黑白颠倒得理直气壮。

网上说这是抑郁症的典型症状，我对照着看了三遍，觉得每一条都是在写我。但去医院这件事，我从没想过要去——一想到要在陌生人面前坐下，回答"最近是否情绪低落"这类问题，就觉得比病本身更难以忍受。于是就这么耗着，一边觉得自己有病，一边又懒得给这病一个正经的名字。

楼下小区的流浪猫见谁都躲，有天却蹭到我脚边不走，蹲在台阶上看我，一副见怪不怪的样子。我心想，可能我这半个月看起来确实比它还落魄。手机两次没电，都刚好是消息弹出来又没来得及看的时候，我一边充电一边觉得，连电量都跟我作对。

第十六天，我翻出手机相册，翻到一年前拍的一张照片：奶茶店门口那棵老槐树，树影斜斜地铺在灰墙上。我盯着那张照片看了很久，然后换了件衣服，出了门。

桌上一本《麦田里的守望者》，我塞进了外套口袋，也不知道带它干什么。

店里人少，她竟然也在，坐在上次那个位置，面前一杯咖啡，没带孩子。走到她对面坐下时，她把桌上的东西往旁边挪了挪，给我腾出位置。

"瘦了。"她说，没抬头。

"嗯。"

店员过来，我要了甜醅奶茶。她面前的咖啡还剩小半杯，没再点。

沉默了很久，她先开口："毕业了不去找工作？"

"我爸让我考公。"

"你不想？"

"我想自己先试试，开个店也好，倒腾点什么也好。他说这是不入流的事。"我说这话的时候声音有点发抖，自己都没料到。

她没接话，只是端起杯子喝了一口，很慢。"我年轻那会儿，是没得选。现在的年轻人愁的不是没得选，是选项太多，怕选错。"她说，"你才二十出头，输得起。"

这句话不像是安慰，更像是随口一说，我一时不知道该怎么接。

我把《麦田》从口袋里掏出来放在桌上，也没打开。"里面有句话，霍尔顿说他想当个麦田里的守望者，专门捉住那些往悬崖边跑的孩子。"

"捉住以后呢？"她问，这次是真的在问我，不是替我回答。

我说不知道。

她没再说什么，只是低头把咖啡杯转了半圈，杯底和碟子磕出很轻的一声响。

"你现在这样，也不是什么大事。"过了一会儿她说，"顶多就是走错几步。走错几步，人还是那个人。"

我们又坐了一会儿，谁都没再说话。她的手指在杯沿上摩挲了两下，然后拿起包，说婆婆在楼下等她。

我坐在原地，把那截栏杆和上次的乐高小人放在一起，两个凑巧能拼上。

我叫住店员，要了一杯甜醅奶茶打包。走到门口结账时，老板娘擦着杯子随口说："刚才那女的，我总觉得眼熟，你认识？"

"不认识。"我说。

推门出去，太阳很大。阳光里弥漫着兰州夏末特有的干燥气味，还有手里那杯甜醅奶茶隐隐透出的酸甜酒香。我从口袋摸出手机，翻到父亲的号码，拇指在屏幕上方悬了很久。

我没有拨出去。但手指碰到了口袋里那两截乐高，还有那本被磨得发亮的书，忽然没那么慌了。

我把手机放回口袋，往公交站走去。步子不快，但没停。`

        content: `车经过黑麦牛肉面的时候，发现今天吃饭的人不太多，当我把车停靠在站台时，一对年轻男女有点依依不舍的告别，奇怪的是，年轻男子开了车，女主倒是来坐我这破公交，搞不懂为什么。想想开公交两年来这种奇怪的事儿见了也不少，不过我这路车是从殡仪馆开出的，看见的欢乐不多，乘客总是阴沉着脸。

启动开车。
不行，我也不能死，儿子和女儿刚读大学，再过不了多久，我还要抱孙子呢。想到了孙子，脚下的油门踩的更有动力了。只是路破，车跑不了多快，还是山路，抱着活得决心，还是平稳一点好。我的人生，倒没有那么稳。
出生于改革开放前夕，父亲接手一座小工厂，后来发展成我们镇子数一数二的民企。我是从饿到饱过来的。可能各地有各地的大院子弟，我们兰州的大院，在西固，虽然我不在西固成长，也算是自封的小院子弟吧。那时候天生低人一等，属于不那么纨绔的子弟，坏也坏不出风格和特色。最多最多，粪坑里扔炮，只不过，我是被扔的那一个。

        content: `那些在深夜吃猫饭的人，后来都消失在便利店的灯火里了吗？

无数个无所事事的夜晚，我独自坐在窗前，冰白在杯中慢慢融化，屏幕里播放着《深夜食堂》。外面的灯火再璀璨，也无法驱散这突如其来的空洞。

村上春树说过：“有谁会喜欢孤独呢？”不好意思，正是在下。每个人都有属于自己的井，而我在井底，盯着世界的裂缝，同时，吮吸自己失败的人生。

回到《深夜食堂》，在第一季里，我始终忘不掉那个叫美雪的女孩。她总是在清晨出现，点一份最简单的、撒了鲣鱼花的“猫饭”。她在KTV里唱一整天的演歌，即便唱片一张也卖不出去。那种在空旷房间里孤独歌唱的样子，像极了村上笔下的主角——生活在边缘，用一种近乎偏执的节奏，守护着内心的一点点火苗。

这种“不被看见”的孤独，我在现实里也撞见过。

我妹的便利店里，有个小男孩，总是沉默地站在货架前，仰着头盯着顶端的进口巧克力。他不说话，不翻兜，只是静静地站着，像在朝圣。那一刻，我想起美雪。她等待歌声被世界听见，而这个重组家庭的孩子，等待那块巧克力填满心里的空洞。但他不会开口，世界也不会弯腰。美雪最终像猫一样悄无声息地离开，而男孩还在便利店的灯光下，寻找属于他的确定性。

当然，不能以貌取人。《深夜食堂》里那个穿黑西装的阿龙，每次都点章鱼香肠——一种小孩才会迷恋的食物。硬汉的盔甲下，藏着最隐秘的出口。

我妹店里也有一个“话多版”的阿龙：一个满身戾气的大妈。她每次出现，都带着碎碎念和恶毒，咒骂儿子的二婚老婆，数落孙子不争气。可讽刺的是，每次骂完，她都会从单薄的退休金里抠出几张毛票，给那个“不争气”的孙子买最好的零食。她用刺耳的碎碎念包裹自己，像阿龙的黑西装。我们以为这种人不好惹，其实那不过是他们在面对这个不温柔的世界时，为了保护残存的爱，不得不长出的倒刺。

冰白见底，街道偶尔有车驶过，灯火闪烁。我想，明天我还是会去便利店，看那个男孩有没有买到巧克力，听那个大妈是不是又有新的牢骚。

我们都在便利店的灯火里，假装自己不是猫。`

        content: `迪卡侬

收到老总发来的五万块奖金和一个月的长假通知时，西直门立交桥正堵得像一条死去的巨蟒。在整个北京城里，平凡从来不是一种选择，而是一种惩罚。

我在那外观富丽堂皇、里面却犹如春运火车般拥挤的格子间里熬了两年。同事们对我报以某种毫无深度的羡慕，觉得我拿了一笔意外的横财；李总看我的眼神则带着一丝冷冰冰的嘲弄。他们都以为我有了去处，但我知道，我只是被这个庞大的机器暂时拧下来、丢在了路边。

搬来西直门之后，我养成了一个习惯。每天下班往右走，去中关村的家乐福。有时候也不买东西，就在里面走，一圈，两圈。那里的人都有明确的目的，买菜，买洗衣粉，推着孩子。没有人知道别人是谁。

偶尔我也会往左走远一点，去百安居。推那种红色的笨重手推车，摸一摸木板，闻一闻油漆和木头混在一起的味道。家乐福是过日子，百安居是装修一个家——两个都和我没什么关系，但两个地方我都熟。

今天下班的时候我站在路口。往右是家乐福，往左是百安居。

我直走了。

我去了公交站，顺着人流上了一辆不知名的公交车。车上人不多，后门边上有空位，我就坐了。车开了一会儿才发现方向不对，但我没下去。就那么坐着。

到站的时候跟着一对情侣下了车，他们拐进一个小区，我站在路边看到了一个蓝色的房子。迪卡侬。好像在哪见过这个名字。也可能没见过，只是蓝色的房子在傍晚亮着灯，让人想走进去。

里面很大，货架很高，帐篷搭在半空，皮划艇吊在头顶上。登山杖一百多，背包两百出头，水壶三十九。都不算贵，但我什么也不需要。走了一圈，手是空的。

临到收银台，旁边的架子上挂着毛巾，灰色的，叠得整齐，我随手抽了一条。

结账的时候收银员说二十九。我愣了一下，水壶才三十九，一条毛巾二十九。但我没说什么，把钱递过去了。她给我一个蓝色塑料袋，上面印着店名。我拎着走出去，站在路边把毛巾掏出来看了看，又放回去。

返回的公交车来时我就上去了，依旧没看是几路。

回到西直门大概九点多。天桥上有人卖袜子，袜子摆在一块布上，颜色鲜艳。我从旁边走过去。口袋里有一条二十九块钱的毛巾，手机里有一条短信，说我有五万块和一个月的假。

我什么也没想。就在天桥上站了一会儿，看桥下车灯连成一条河，缓缓地淌着。

西直门

公司在西直门，公寓却在东直门。

我没有睡懒觉的习惯，但也不愿意每天把两个小时耗在路上，于是在单位附近找了一套公寓。

两室一厅，不大不小。客厅里摆着索尼的电视，厨房里是海尔的冰箱，墙上挂着东芝的空调，角落里放着西门子的洗衣机。如果只看这些东西，这个房子甚至称得上体面。

只是那套纯欧式的装修实在让人无法理解。

墙上的花纹，厚重的窗帘，仿佛主人曾经幻想自己住在某个欧洲小镇的别墅里。但这里是北京，一个月租金可以买下很多现实妥协的地方。

其实可以不租。只是价格太诱人。

公司九点上班，离公寓不过十分钟的路程。如果正常一点，八点半起床也完全来得及。

但我每天七点都会醒。

醒了以后并不会马上起床，只是躺在床上，看着天花板发一会儿呆。准确地说，是看着那套我永远无法理解的欧式装修发一会儿呆。

我不知道房东为什么会喜欢这样的设计。客厅的吊灯像某个宫殿里缩小之后的仿制品，墙上的花纹试图营造一种欧洲贵族的感觉，放在这个二十多平方米的客厅里，显得格格不入。

我每天都会在脑子里批判一遍，从吊灯，到窗帘，再到那张不知道从哪里买来的茶几。

奇怪的是，批判完以后，我还是住在这里。

七点半左右，我才起床洗漱。偶尔女友会过来住一晚。第二天早上，她总是在我洗漱回来以后才醒。

第一次发现这个时间差的时候，她坐在床上看着我，问：
“你几点起来的？”
“七点。”
她看了一眼手机：“你不是九点上班吗？”
“公司离这里近。”
“那你也不用七点起来吧？”

我没有回答。其实我也不知道为什么，可能只是习惯。

七点醒来以后，我总要在房间里待一会儿。看看窗外，看看那套让我无法理解的装修，或者什么都不做。她觉得这是浪费时间。

七点半，我起身去洗漱。镜子里的水汽散开之前，我能看见身后那盏吊灯——缩小版的宫殿，在晨光里轻微晃了一下。

出门的时候，钥匙在包里响了两声。

早餐是一定要吃的，这是我很多年来养成的习惯。通常我会在楼下的7-11买一个三明治或者饭团，再配一盒牛奶。不知从什么时候开始，在我的认知里，牛奶属于早餐，咖啡属于工作。所以即使早餐套餐里送了一杯咖啡，我还是会另外买一盒牛奶。我一直喝冰牛奶，热牛奶我接受不了，除非加很多糖。

七点四十左右，我出门。

其实从这里到公司只需要十分钟，但我还是习惯提前离开。楼下的便利店刚换好早餐货架，玻璃门上挂着水汽。有人进去买咖啡，有人匆匆赶地铁，每个人看起来都有极其明确的方向。

我站在门口喝完最后一口牛奶，把空罐扔进垃圾桶，朝公司的方向走去。

而太阳，还没有升起。

百合花

女友喜欢百合。倒不是因为我是兰州人，而兰州的百合有些名气——她只是单纯喜欢这种花。她总说，百合的香气很高贵。气味在我眼里只有好闻和不好闻的区别，但后来，我的房间里经常会有一束百合。

她是好友的妹妹。认识很多年，我甚至已经记不清我们到底是什么时候走近的。可能是她哥有意撮合，也可能只是某一次喝完酒后，两个熟悉的人突然觉得可以牵一下手。

女友不常来。偶尔住几天，她总会先去一趟超市，回来把我的冰箱塞得满满当当。每次打开冰箱，她都会露出一种难以理解的表情：“你这里除了牛奶，还有什么？”然后一边摇头，一边把水果、蔬菜、酸奶和各种零食往里面放。她总开玩笑说，搞定一个男人，首先要搞定他的胃。

等到晚饭时间，我们还是会一起点外卖。那个时候外卖远没有后来方便，选择不多，等待时间极长。可谁也不想真正动手做饭。于是我们躺在沙发上，用遥控器无聊地翻着电视频道，任凭冰箱负重前行。

女友对亲密这件事一直很平淡。年轻的时候，我也曾有过于旺盛的冲动，大学里的我对欲望几乎没有克制，总觉得某些经历能证明自己的魅力与成长。但毕业后不过两年，我却慢慢安静了下来。和她在一起后，我们之间的亲密更像一种定期的仪式，越接近，越能感觉到彼此身上的脆弱与疏离。

我一直坚持一些谨慎的习惯，比如避孕措施。她偶尔会笑我太过克制，不像个年轻男人。我只是笑笑，把她搂得更紧了一点。

她后来也发现我有一些坏习惯。比如明明知道自己肠胃孱弱，却总对火锅缴械投降。每次吃完，半夜总要跑几趟厕所。她总提醒我不要这样折腾自己，我答应得很快，但下次看到滚烫的红汤，还是会忘记之前的承诺。

她说我有时候不像一个成年人。嘴上嫌弃着，最后却还是帮我收拾残局。收拾完后，她通常坐在沙发上继续翻着电视，告诉我下一次她真的不会再管了。

我知道这是气话。至少那时候，我是这么认为的。

冰箱

打开冰箱取牛奶的时候，我看见了角落里的那个芒果。

它已经缩成一团，表皮皱得不像样子。我盯着它看了好一会儿，才想起来那是她买回来的。

也是在那个时刻，我猛然意识到，她已经整整五天没有任何消息了。

五天。

我一如既往地七点醒来，坐在床边发一会儿呆。七点四十出门，路上买早餐。五点半下班，偶尔去家乐福转一圈，看着里面的人推着购物车挑选蔬菜、洗衣粉和孩子的零食。晚上回家打开电视，或者找些电影看，甚至连以前那些消遣都提不起精神。

手机突然的静音，反而带给我一种难得的清凉与寂静。偶尔亮起的屏幕，也只是电信公司催缴话费的机械通知。

我没有去找她。可能是她工作太忙，暂时不方便联系；也可能是她突然发现自己无法再忍受我的那些毛病；甚至，她遇到了一个更适合她的人。

直到那天晚上回家。

我走进卫生间，习惯性地打开马桶盖。里面已经一片狼藉。我愣了一下，才意识到这已经不是一天两天的事情。只是以前，她总会提醒我，也总会在抱怨之后帮我彻底清理干净。

我好像真的失去她了。

我打开手机通讯录，翻了一遍，又翻了一遍。才发现自己竟然没有几个和她直接相关的联系人。她的朋友我不认识，她工作的地方我只知道大概，她平时见什么人、去什么地方，我一概说不上来。

我们之间唯一的连接是她的哥哥，也是我的朋友。可偏偏之前因为一些微小的龃龉，我删掉了他的联系方式。

我盯着通讯录看了很久，起身走进厨房。冰箱里那些她买回来的东西，正在一样一样走向腐烂。牛奶结了块，蔬菜蔫成一团，她说要给我炖汤的排骨还冻在最底层。浴室的置物架上，她的牙刷立在那里，刷毛干得发硬。抽屉里，还有一包拆开用了一半、再也没有动过的卫生巾。

我想她。可是我不知道该去哪里找她。

金鱼

女友消失后的第二十三天，是一个周末。

我从西直门出发，沿着中关村的方向慢慢走，没有目的，只是觉得待在房间里太安静。

路过北京动物园的时候，看见一个大叔推着一辆自行车，车旁摆着几个透明的塑料袋，里面装着金鱼。我走过去看了一眼，只是很普通的金鱼，红色的，黄色的，尾巴在浑浊的水里轻轻摆动。

正准备转身离开，大叔突然开口：“金鱼，不喜欢？”

我愣了一下：“不喜欢。”

他说话的时候，我甚至怀疑他有没有看向我。

“金鱼挺好的。”他低头看着袋子里的鱼，“安静，不吵，也不用带出去。”

我笑了一下：“我喜欢有手感的动物。”

大叔却点了点头：“金鱼也有。只是你摸不到。”

我不知道该怎么回答。他已经弯下腰开始捞鱼。

“送你两条。”

“不要了。”我赶紧摆手，“还得买鱼缸。”

“不麻烦，”他说，“先养起来。”

我还想拒绝，他已经把装着两条金鱼的塑料袋塞进我手里，顺势递给我一张名片：“这个收好。以后需要鱼缸，打这个电话。”

我本来准备掏钱：“多少钱？”

他却像没有听见一样，继续整理自行车上的东西：“鱼缸不用买，他们会准备。”

“可是……”

“两天。”他突然说。

“两天？”

“别超过两天。”他说得很平静，“鱼离开适合的环境太久，会死。”

我还想再问，他已经骑上自行车。我喊了一声“多少钱”，他没有回头，只是挥了挥手，连人带车慢慢消失在稀疏的人群里。

我站在原地，手里提着两条塑料袋里的金鱼，还有一张莫名其妙的名片。

第二天，我拨通了电话。电话那头是一个年轻男人的声音，听到我的来意后，他沉默了一会儿。

“你拿到了？”

“嗯。”

“地址发给你。”

我看了一眼短信：王府半岛。

站在酒店门口的时候，我第一次觉得自己和这里格格不入。倒不是没见过高级场所，只是这里的一切都与我手里的东西毫无关系。穿着西装的人匆匆经过，橱窗里的奢侈品安静地立着，灯光、香气、服务人员无瑕的微笑，都属于另一个世界。而我提着一个塑料袋，里面装着两条几块钱的金鱼。

我甚至不知道自己为什么会来，我只是来取一个鱼缸。

工作人员没有多问，确认名字后，带我去了一间休息室。那里已经摆着一个准备好的鱼缸：干净的水，造景假山，还有完整的饲养用品。

我站在那里，有些不知所措。一个街边卖金鱼的大叔，一家顶级酒店，一个不知道从何而来的鱼缸，还有两条我本来不想要的鱼。

我正准备询问该怎么搬走，工作人员看了我一眼，平静地说：“先生，我们会安排送到您西直门的住所。”

我愣住了：“我的住所？”

他点点头：“是的。”

我没有再说话，只是看着水里那两条金鱼。

北京

假期还剩不到一周，我准备回兰州一趟。

而我并不喜欢北京，至少不是传统意义上的喜欢。我不喜欢这里漫长的冬天，不喜欢拥挤的地铁，不喜欢走很远却找不到一家真正想吃的店。

但我喜欢北京的一点：它不会追问你。

在兰州，走在街上随时会遇到熟人，别人知道你的父母，知道你读过哪所学校，知道你过去的一切底细。北京不会。你可以一个人坐在地铁里两个小时，可以一个人在街边吞咽食物，可以站在千万人群中，没有任何人知道你的名字。

收拾行李的时候，我突然想起刚到北京读大学的日子。那时候每逢周末，我都会坐地铁去王府井。不是为了买东西，也不是为了见谁，我只是习惯一个人走进地铁站，找个角落坐下来看一会儿书。

具体看过什么已经模糊，可能是村上的小说，也许是《奇鸟行状录》，也许是《海边的卡夫卡》。一本写着地下深处的井，一本写着寻找乌鸦的少年。坐上一两个小时后，我会搭地铁去西单，然后顺着街角慢慢走回去。

我也曾尝试过大学时一整周不给任何人发短信，想看看如果不主动联系，会不会有人发现我的不存在。

事实和我想的一样：没有人。整整两周，手机安静得像一块废弃的塑料，偶尔亮起屏幕，也只有中国移动提醒我缴纳话费。那个时候我甚至觉得有些好笑——偌大的城市里，我活着的唯一证明，竟然只剩下运营商数据库里的一行通讯记录。当然，系统也并不是真的在乎我。

大学那几年还发生过一些荒诞的小事。有一次，一个熟人声称可以介绍演艺圈的人给我认识，甚至能见到当时红极一时的明星。我那时候还年轻，心里多少存有一丝不切实际的期待。北京太大了，大到似乎任何异迹都有可能发生。

结果第二天，我的松下手机丢了。我站在公交站旁摸着空荡荡的口袋，突然觉得荒谬可笑。昨天还以为自己脚踏在另一个世界的边缘，今天却连所有联系人的号码都丢得一干二净。后来那个所谓的“机会”，自然也就没有了后来。

那几年我特别喜欢换手机号，换了就不通知任何人。打不通的时候，对方大概以为是网络不好，再打一次依旧不通，便也就算了。包括我的父母，也很少主动确认我在北京到底过得怎样。他们知道我上了大学，知道我还活着，除此之外，便再无其他。

红嘴山鸦

我沿着路灯的阴影走。

深夜的街道干瘪得像一张脱了水的纸。街灯隔着固定的距离亮起，把我的影子拉长、压缩、再拉长，像工厂流水线上一块被反复切割的废料。

路过那张漆皮剥落的木椅时，我坐了下来。

它就是那个时候落下来的。没有鸽子那种讨好的咕咕声，没有任何预兆，一阵极其轻微的风压在了我的左肩上。爪子透过外套的布料扣进来，钝，且重。

嘴和脚红得像块刚淬过火又冷掉的硬铁，在灰蒙蒙的街灯下有一股极其不合时宜的鲜艳。它没有飞，也没有叫，只是偏过头，用鸟类那种毫无情绪的黄色侧眼盯着我的脸。

我没动，甚至不敢大声呼吸。

它跳到我的膝盖上，红色的嘴喙轻啄着我的金属袖扣，发出啪嗒、啪嗒的微响。然后它抬起头，蹭了蹭我的手指。

别人如果看见这一幕，大概会觉得坐在街边对着一只鸟发呆的人是个疯子。但我只是觉得，至少它不会打断我，也不会试图从我这里要一个关于未来的承诺。它像是在用爪子和嘴，测试我这具身体到底是活人的骨肉，还是一块合成塑料。

我经常怀疑自己是不是某种早期的 AI 程序——被预设了七点醒来的闹钟，预设了喝冰牛奶的习惯，预设了去西直门上班的路线。我看似在生活，实际上只是在执行一段没有报错、但也毫无意义的代码。甚至连女友的离开，也只是系统悄无声息地卸载了一个不再兼容的插件。

那只鸟突然张开翅膀。拍打空气的声音极其沉重，像是一块湿布甩在墙上。它腾空飞走，瞬间消失在漆黑的树冠里。

肩膀上被爪子扣过的地方，留着一点隐隐的钝痛。我抬手摸了摸。

痛感是真的。

我站起来，继续朝公寓走去。回到房间已是凌晨三点，我把那条二十九块钱的灰毛巾挂在卫生间，视线绕开了洗手台。鱼缸里的水泵发出微弱而持续的低鸣，两条金鱼在黑暗里悬浮着，像两片不会腐烂的叶子。

我躺在床上。睡觉的时候我不老实，脚习惯性地往旁边踢了一下。以前那个位置总有个温度在，她会迷迷糊糊地伸手把我的脚推开，动作很轻，挪回去，然后继续睡。那时候我觉得这件事再普通不过，像冰箱里的牛奶，浴室里的牙刷。

这一次，脚悬在半空，落在一片冰凉的虚无里。

我没有伸手去摸那个空位。那张不算宽的双人床，第一次显得这么大。

凌晨三点四十分，客厅里的座机突然响了起来。最开始我只是觉得刺耳，甚至没有意识到那声音来自我的房间。这部座机装上以后我几乎没有用过，甚至不知道它的号码。

我起身走到客厅，拿起听筒的时候，第一反应是准备骂人——以前住酒店也遇到过半夜打来的骚扰电话，那种不用猜就知道内容的陌生来电。

里面没有背景音，只有极干净的呼吸声。

“沈恕裕？”

“你是谁？”

电话那头停顿了两秒，声音平得像一条直线：

“红嘴山鸦一般不在市区过夜。”

          if (data.works && data.works.length > 0) {
            // 合并线上数据库与本地静态库（线上同 slug 优先覆盖）
            const dbMap = new Map(data.works.map(w => [w.slug, w]));
            const merged = [...data.works];
            STATIC_WORKS.forEach(sw => {
              if (!dbMap.has(sw.slug)) merged.push(sw);
            });
            WORKS = merged;
            publishedWorks = WORKS.filter(w => w.status === 'published');
            navigate(); // 数据同步后重新刷新当前视图
          }
        }
      } catch (e) {
        // 后端未部署或离线时静默使用静态作品，不影响正常浏览
      }
    }

    /**
     * 每日确定性插画选择算法：基于历法自然日生成哈希种子，单日内刷新绝对一致
     */
    function getDailyFeaturedWork() {
      const eligibleWorks = publishedWorks.filter(w => w.coverImage && w.coverImage.trim() !== '');
      if (eligibleWorks.length === 0) return publishedWorks[0];
      const now = new Date();
      const dayHash = (now.getFullYear() * 365) + ((now.getMonth() + 1) * 31) + now.getDate();
      const index = Math.abs(dayHash) % eligibleWorks.length;
      return eligibleWorks[index];
    }

    function renderSafeParagraphs(container, text) {
      container.innerHTML = '';
      if (!text) return;
      // 以空行作为自然段落切分，保留单换行与文本原有符号
      const paras = text.split(/\n\s*\n/);
      // 正文图片匹配正则表达式：![alt](url) 或 [image: url | caption]
      const mdImgRegex = /^!\[(.*?)\]\((.*?)\)$/;
      const tagImgRegex = /^\[image:\s*(.*?)(?:\s*\|\s*(.*?))?\]$/;

      paras.forEach(pText => {
        const trimmed = pText.trim();
        if (!trimmed) return;

        // 1. 判断当前段落是否是单独成行的插图语法
        const mdMatch = trimmed.match(mdImgRegex);
        const tagMatch = trimmed.match(tagImgRegex);

        if (mdMatch || tagMatch) {
          const imgSrc = (mdMatch ? mdMatch[2] : tagMatch[1]).trim();
          const imgCaption = (mdMatch ? mdMatch[1] : (tagMatch[2] || '')).trim();

          if (imgSrc) {
            const figure = document.createElement('figure');
            figure.className = 'reader-inline-figure';

            const img = document.createElement('img');
            img.src = imgSrc;
            img.alt = imgCaption || '作品插图';
            img.className = 'reader-inline-img';
            img.loading = 'lazy';
            img.onerror = () => figure.remove(); // 图片加载失败时静默移除，保证不破坏阅读流

            figure.appendChild(img);

            if (imgCaption) {
              const caption = document.createElement('figcaption');
              caption.className = 'reader-inline-caption';
              caption.textContent = imgCaption;
              figure.appendChild(caption);
            }

            container.appendChild(figure);
            return;
          }
        }

        // 2. 普通文本段落
        const p = document.createElement('p');
        p.textContent = trimmed;
        container.appendChild(p);
      });
    }

    function updatePageMeta(title, desc) {
      document.title = title ? `${title} — 乌鸦与井` : '乌鸦与井 — 个人语料库与影像诗';
      const descEl = document.querySelector('meta[name="description"]');
      if (descEl && desc) {
        descEl.setAttribute('content', desc.slice(0, 140));
      }
    }

    /* ==========================================================================
       三、客户端 Hash 路由与各视图渲染
       ========================================================================== */
    function navigate() {
      const rawHash = window.location.hash || '#/';
      const cleanHash = rawHash.replace(/\/+$/, '') || '#/';
      const main = document.getElementById('main-content');
      const navArchive = document.getElementById('nav-archive');
      const navAbout = document.getElementById('nav-about');

      if (navArchive) navArchive.classList.toggle('active', cleanHash.startsWith('#/archive'));
      if (navAbout) navAbout.classList.toggle('active', cleanHash === '#/about' || cleanHash === '#/notes');

      // 重置阅读进度条与滚动位置
      const progress = document.getElementById('read-progress');
      if (progress) progress.style.width = '0%';
      window.scrollTo(0, 0);

      // 清理阅读页监听
      window.onscroll = null;

      // 1. 作品阅读页: #/works/{slug}
      if (cleanHash.startsWith('#/works/')) {
        const slug = cleanHash.replace('#/works/', '').trim();
        renderReaderView(main, slug);
        return;
      }

      // 2. 目录页: #/archive/{type}
      if (cleanHash.startsWith('#/archive')) {
        const parts = cleanHash.split('/');
        const catKey = parts[2] || 'all';
        renderArchiveView(main, catKey);
        return;
      }

      // 3. 创作札记页: #/notes
      if (cleanHash === '#/notes') {
        renderNotesView(main);
        return;
      }

      // 4. 关于页面: #/about
      if (cleanHash === '#/about') {
        renderAboutView(main);
        return;
      }

      // 5. 作者信箱管理页面: #/admin/letters
      if (cleanHash === '#/admin/letters') {
        renderAdminLettersView(main);
        return;
      }

      // 默认渲染极简搜索首页
      renderHomeView(main);
    }

    /**
     * 首页安全文本输出：标题 / 系列名 / 摘选一律转义，避免作品文本被当作 HTML 执行
     */
    function escapeHomeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * 图片地址进入内联 style 的 url() 前做最小净化，只处理样式语法字符
     */
    function sanitizeHomeImageUrl(url) {
      return String(url || '')
        .replace(/\\/g, '')
        .replace(/[\r\n\t]/g, '')
        .replace(/'/g, '%27')
        .replace(/"/g, '%22')
        .replace(/\(/g, '%28')
        .replace(/\)/g, '%29');
    }

    /**
     * 首页文句摘选：优先使用作品既有 summary 字段；
     * 仅当 summary 为空时从正文只读截取，绝不写回作品数据。
     */
    function deriveHomeExcerpt(work, maxLen) {
      if (!work) return '';

      const limit = maxLen || 112;
      const existingSummary = typeof work.summary === 'string' ? work.summary.trim() : '';
      if (existingSummary) return existingSummary;

      const raw = typeof work.content === 'string' ? work.content : '';
      if (!raw) return '';

      // 只读清洗：剔除 Markdown 插图、链接语法、标题标记、分隔线与引用符号
      const cleaned = raw
        .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
        .replace(/\[image:[^\]]*\]/gi, '')
        .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
        .replace(/^\s{0,3}#{1,6}\s+/gm, '')
        .replace(/^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/gm, '')
        .replace(/^\s*>\s?/gm, '')
        .replace(/`{1,3}/g, '')
        .replace(/\r\n?/g, '\n');

      // 按空行切段，丢弃只有卷号标记的段落（如「一」「二」），优先保留完整句子
      const paragraphs = cleaned
        .split(/\n\s*\n/)
        .map(p => p.replace(/\s*\n\s*/g, ' ').trim())
        .filter(p => p && !/^[一二三四五六七八九十百千零〇0-9]{1,3}$/.test(p));

      let excerpt = '';
      for (let i = 0; i < paragraphs.length; i += 1) {
        const next = excerpt ? excerpt + ' ' + paragraphs[i] : paragraphs[i];
        excerpt = next;
        if (next.length >= limit) break;
      }

      excerpt = excerpt.trim();
      if (!excerpt) return '';
      if (excerpt.length <= limit) return excerpt;

      const cut = excerpt.slice(0, limit);
      const lastStop = Math.max(
        cut.lastIndexOf('。'),
        cut.lastIndexOf('！'),
        cut.lastIndexOf('？'),
        cut.lastIndexOf('，')
      );
      return (lastStop > limit * 0.55 ? cut.slice(0, lastStop + 1) : cut) + '……';
    }

      function executeSearch(query) {
        const q = query.trim().toLowerCase();

          resultsBox.style.display = 'none';
          return;

          const inTitle = w.title.toLowerCase().includes(q);
          const inSummary = (w.summary || '').toLowerCase().includes(q);
          const inContent = (w.content || '').toLowerCase().includes(q);
          const inTags = w.tags && w.tags.some(t => t.toLowerCase().includes(q));
          const inSeries = w.series && w.series.toLowerCase().includes(q);

    /**

     */
    window.quickSearch = function (keyword) {
      const input = document.getElementById('homeSearchInput');
      if (!input) return;
      input.value = keyword;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.focus();
    };

    /**
     * 「随缘」与「指路标签」：一次性事件委托，避免每次 renderHomeView 重复注册全局监听
     */
    (function bindHomeMagazineDelegation() {
      if (window.__crowHomeDelegationBound) return;
      window.__crowHomeDelegationBound = true;

      document.addEventListener('click', (e) => {
        const target = e.target;
        if (!target || typeof target.closest !== 'function') return;

        const randomBtn = target.closest('#randomPickBtn');
        if (randomBtn) {
          e.preventDefault();
          // 仅从公开作品集合 publishedWorks 中抽取，不涉及草稿与隐藏内容
          if (!Array.isArray(publishedWorks) || publishedWorks.length === 0) return;
          const pick = publishedWorks[Math.floor(Math.random() * publishedWorks.length)];
          if (!pick || !pick.slug) return;
          const targetHash = `#/works/${pick.slug}`;
          if (window.location.hash === targetHash) {
            navigate();
          } else {
            window.location.hash = targetHash;
          }
          return;
        }

        const chip = target.closest('.suggest-chip');
        if (chip) {
          e.preventDefault();
          const keyword = chip.dataset.keyword || chip.textContent.trim();
          if (keyword && typeof window.quickSearch === 'function') {
            window.quickSearch(keyword);
          }
        }
      });
    })();

    /**
     * 2. 目录页（归档与分类浏览）
     */
    function renderArchiveView(container, catKey) {
      const currentCat = CATEGORIES.find(c => c.key === catKey) || CATEGORIES[0];
      updatePageMeta(currentCat.title, currentCat.desc);

      let filtered = publishedWorks;
      if (currentCat.key !== 'all') {
        filtered = publishedWorks.filter(w => w.type === currentCat.key);
      }

      filtered.sort((a, b) => {
        if (a.series && b.series && a.series === b.series) {
          return (a.orderInSeries || 0) - (b.orderInSeries || 0);
        }
        return new Date(b.date) - new Date(a.date);
      });

      container.innerHTML = `
        <div class="inner-page-wrap">
          <nav class="archive-category-nav" aria-label="作品分类筛选">
            ${CATEGORIES.map(cat => `
              <a href="#/archive/${cat.key}" class="archive-cat-btn ${cat.key === currentCat.key ? 'active' : ''}">${cat.title}</a>
            `).join('')}
          </nav>

          <header class="archive-header">
            <h1 class="archive-title">${currentCat.title}</h1>
            <p class="archive-desc">${currentCat.desc}</p>
          </header>
          <div id="archiveWorkList"></div>
        </div>
      `;

      const listContainer = container.querySelector('#archiveWorkList');
      renderWorksList(listContainer, filtered);
    }

    /**
     * 通用作品列表条目渲染（严格保留原貌，未设 summary 则不输出任何简介节点）
     */
    function renderWorksList(container, works, customHeading = null) {
      if (works.length === 0) {
        container.innerHTML = `<div class="empty-tip">未检索到相关作品。</div>`;
        return;
      }

      const listEl = document.createElement('div');
      listEl.className = 'works-grid';

      works.forEach(w => {
        const item = document.createElement('a');
        item.href = `#/works/${w.slug}`;
        item.className = `work-row-item ${!w.coverImage ? 'no-thumb' : ''}`;

        const catObj = CATEGORIES.find(c => c.key === w.type);
        const catLabel = catObj ? catObj.title : '单篇';
        const seriesLabel = w.series ? ` · 《${w.series}》第 ${w.orderInSeries || 1} 卷` : '';

        item.innerHTML = `
          <div class="work-info">
            <div class="work-meta">${catLabel}${seriesLabel} &mdash; ${w.date}</div>
            <h2 class="work-title">${w.title}</h2>
            ${w.summary ? `<p class="work-summary">${w.summary}</p>` : ''}
          </div>
          ${w.coverImage ? `<img class="work-thumb" src="${w.coverImage}" alt="${w.title} 缩略图" loading="lazy">` : ''}
        `;

        const thumb = item.querySelector('.work-thumb');
        if (thumb) {
          thumb.onerror = () => { thumb.remove(); item.classList.add('no-thumb'); };
        }

        listEl.appendChild(item);
      });

      container.innerHTML = '';
      if (customHeading) {
        const h = document.createElement('div');
        h.style.fontSize = '0.78rem';
        h.style.color = 'var(--color-text-subtle)';
        h.style.marginBottom = '16px';
        h.style.fontFamily = 'var(--font-serif)';
        h.textContent = customHeading;
        container.appendChild(h);
      }
      container.appendChild(listEl);
    }

    /**
     * 3. 独立作品阅读视图
     */
    function renderReaderView(container, slug) {
      const work = publishedWorks.find(w => w.slug === slug);
      if (!work) {
        container.innerHTML = `
          <div class="inner-page-wrap">
